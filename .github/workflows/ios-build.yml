name: iOS Build

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]

jobs:
  build:
    name: Build iOS app
    runs-on: macos-26

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build for iOS Simulator
        run: >-
          xcodebuild build
          -project heatguard-iOS.xcodeproj
          -scheme heatguard-iOS
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
